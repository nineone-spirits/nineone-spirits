name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前建议先看一眼 `README.md` 的「已知限制」和「路线图」——有些边界是刻意的取舍
        （比如不做云端识别、不做形近字替换），而不是没做完。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 先说问题，再说方案。描述具体的使用场景比「希望能更智能」有用得多
      placeholder: 我经常需要从 PDF 里抄三线表，现在输出会把表头和数据行粘在一起……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
      placeholder: 希望能按「表头行 + 数据行」分成两段……
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      placeholder: 试过先复制到 Excel，但合并单元格会丢……

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 识别准确率
        - 主体过滤 / 版面还原
        - 文本整理
        - 交互与界面
        - 安装、打包与分发
        - 文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: willing
    attributes:
      label: 你愿意帮忙实现吗
      options:
        - label: 我愿意提 PR（维护者会在 Issue 里给出改动位置建议）
        - label: 我可以提供复现场景的截图或样本

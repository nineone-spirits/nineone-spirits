name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    name: 发布文档站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 站点由 gh-pages 分支提供（Pages 源就是它）。docs/ 一改就同步过去，
      # 免得文档更新了网页还停在旧版本。
      - name: 同步 docs 到 gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: publish from ${{ github.sha }}"

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 用官方 Actions 部署（仓库 Pages 已设为 build_type=workflow），不再把 docs/ 推到 gh-pages。
# 原因：用 GITHUB_TOKEN 推送的分支不会触发其它工作流，内置的 pages build and deployment
# 收不到事件，网站会一直停在旧版本——上线时踩过这个坑。
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 发布文档站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 打包 docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: 部署
        id: deploy
        uses: actions/deploy-pages@v4
